name: rebuild-first-version

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove automatic node cloning and make this the first version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('main.go')
          s = p.read_text()
          s = s.replace('\n\tmux.HandleFunc("/api/xui/clone", apiXUIClone(mgr))', '')
          s, n = re.subn(r'\n// apiXUIClone .*?\nfunc apiXUIClone\(m \*Manager\) http\.HandlerFunc \{.*?\n\}\n\n// apiXUIDetail', '\n// apiXUIDetail', s, flags=re.S)
          if n != 1:
              raise SystemExit(f'main.go clone handler match count={n}')
          p.write_text(s)

          p = Path('panel.go')
          s = p.read_text()
          old = '\n\tCloneToTunnels(templateID int, hosts []string, tunnels []*Tunnel) ([]int, error)'
          if old not in s:
              raise SystemExit('panel.go CloneToTunnels interface entry not found')
          p.write_text(s.replace(old, ''))

          p = Path('native.go')
          s = p.read_text()
          s, n = re.subn(r'\n// CloneToTunnels .*?\nfunc \(n \*Native\) CloneToTunnels\(templateID int, hosts \[\]string, tunnels \[\]\*Tunnel\) \(\[\]int, error\) \{.*?\n\}\n\n// DeleteInbounds', '\n// DeleteInbounds', s, flags=re.S)
          if n != 1:
              raise SystemExit(f'native.go clone implementation match count={n}')
          p.write_text(s)
          PY

          gofmt -w main.go panel.go native.go
          go test ./...

          cat > README.md <<'EOF'
# fanout-argo

Fanout + VPN Gate 出口管理 + Xray/3x-ui 节点绑定 + Cloudflare Argo。

本版本的核心原则是：**出口可以有一个或多个，出口名称由 VPN Gate 动态返回；节点由用户手动创建，用户手动把每一个节点绑定到指定出口。程序不自动复制、自动生成节点。**

## 工作方式

```text
VPN Gate 节点
    │
    ├── 出口 A（随机 HostName / 随机 SOCKS5 端口）
    ├── 出口 B（随机 HostName / 随机 SOCKS5 端口）
    └── 出口 N（随机 HostName / 随机 SOCKS5 端口）

手工创建节点 1 ──绑定──> 出口 A
手工创建节点 2 ──绑定──> 出口 B
手工创建节点 3 ──绑定──> 出口 N
```

每个节点只对应一个固定出口。一个出口也可以没有节点，也可以挂多个节点。停止/更换出口时，绑定关系按出口 HostName 维护；不会按固定的 1/2/3 名称假定出口数量。

## 节点管理原则

- 不自动按出口复制节点。
- 不因为新增出口自动生成 Xray/3x-ui 入站。
- 用户先手工创建节点，再在节点详情中选择出口进行绑定。
- 支持一个或多个动态出口，出口 HostName 不固定。
- 节点与出口的绑定写入配置并持久化。
- 一个节点只能绑定一个出口；解绑后可以重新绑定到另一个正在运行的出口。
- 节点的端口、UUID/密码、路径等配置不会因为增加另一个出口而自动改变。

## Xray 路由

自建 Xray 模式会为当前正在运行的每个出口生成一个 SOCKS5 outbound，并根据入站的 `BoundTo` 生成精确 routing rule：

```text
inbound: node-A
    ↓
outbound: fanout-<出口HostName-A>
    ↓
SOCKS5 127.0.0.1:<出口随机端口>
    ↓
VPN Gate 出口 A
```

没有绑定出口的节点不会自动挑选出口。

## 安装

```bash
bash <(curl -fsSL https://raw.githubusercontent.com/robertwilliamsc998-ui/fanout-argo/main/install.sh)
```

需要 root，并要求宿主机具备 `/dev/net/tun`、network namespace、iptables 等能力。

## 管理

安装后：

```bash
f
```

出口管理：

1. 创建一个或多个 VPN Gate 出口。
2. 等待出口状态变为运行中。
3. 手工创建 Xray/3x-ui 节点。
4. 打开节点详情。
5. 手工选择目标出口并绑定。
6. 导出该节点链接。

### 绑定示例

```text
VLESS 节点 22521
    ↓
BoundTo = vpn122916437
    ↓
fanout-vpn122916437
    ↓
SOCKS5 127.0.0.1:31344
    ↓
VPN Gate / Japan
```

`vpn122916437` 只是运行时动态返回的一个出口名称，不是程序内置的固定出口。下一次创建出口可能得到完全不同的 HostName。

## Argo

支持为节点使用 Cloudflare Argo/Cloudflare Tunnel 入口，并把 Argo 入站绑定到指定 fanout 出口。

```text
客户端
   ↓
Cloudflare Tunnel
   ↓
Xray WS 入站
   ↓
手工绑定的 fanout 出口
   ↓
VPN Gate
   ↓
最终出口 IP
```

Argo 是入口，VPN Gate 是固定出口，两者分开管理。

## 配置文件

默认工作目录：

```text
/var/lib/fanout/
├── state.json       # 动态出口状态
├── native.json      # 自建 Xray 节点及手工绑定关系
├── xray.json        # 当前生成的 Xray 配置
├── argo.json        # Argo 配置
└── settings.json    # Web 设置
```

`native.json` 中的 `bound_to` 就是节点固定出口的核心绑定字段。

## 许可证

MIT。
EOF

