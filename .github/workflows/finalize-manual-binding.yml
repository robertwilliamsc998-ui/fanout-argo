name: finalize-manual-binding

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove automatic node cloning/provisioning
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def remove_func(path, name):
              p = Path(path)
              s = p.read_text()
              pat = re.compile(r'(?m)^func(?:\s+\([^\n]*\))?\s+' + re.escape(name) + r'\s*\([^\n]*\)\s*(?:\([^\n]*\)|[^\n]*)\s*\{')
              m = pat.search(s)
              if not m:
                  raise SystemExit(f'{path}: function {name} not found')
              start = m.start(); brace = s.find('{', m.start(), m.end())
              depth = 0; i = brace; in_str = None; esc = False; in_line = False; in_block = False
              while i < len(s):
                  c = s[i]; n = s[i+1] if i + 1 < len(s) else ''
                  if in_line:
                      if c == '\n': in_line = False
                  elif in_block:
                      if c == '*' and n == '/': in_block = False; i += 1
                  elif in_str:
                      if esc: esc = False
                      elif c == '\\': esc = True
                      elif c == in_str: in_str = None
                  else:
                      if c == '/' and n == '/': in_line = True; i += 1
                      elif c == '/' and n == '*': in_block = True; i += 1
                      elif c in ('"', '`', "'"): in_str = c
                      elif c == '{': depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              if end < len(s) and s[end] == '\n': end += 1
                              p.write_text(s[:start] + s[end:])
                              return
                  i += 1
              raise SystemExit(f'{path}: unmatched braces in {name}')

          p = Path('main.go')
          s = p.read_text()
          s2 = s.replace('\n\tmux.HandleFunc("/api/xui/clone", apiXUIClone(mgr))', '')
          if s2 == s: raise SystemExit('main.go: clone route not found')
          p.write_text(s2)
          remove_func('main.go', 'apiXUIClone')

          p = Path('panel.go')
          lines = p.read_text().splitlines(True)
          kept = [x for x in lines if 'CloneToTunnels(templateID int, hosts []string, tunnels []*Tunnel)' not in x]
          if len(kept) == len(lines): raise SystemExit('panel.go: clone interface entry not found')
          p.write_text(''.join(kept))

          remove_func('native.go', 'CloneToTunnels')
          remove_func('xui.go', 'CloneToTunnels')

          p = Path('provision.go')
          s = p.read_text()
          s = s.replace('\n\tTemplateID int // 3x-ui 入站模板；0 表示只开隧道不建入站', '')
          s = s.replace('\n\tif req.TemplateID > 0 {\n\t\tlabels = append(labels, "创建节点链接")\n\t}', '')
          s = s.replace('go m.runProvision(job, picks, req.TemplateID)', 'go m.runProvision(job, picks)')
          start = s.find('func (m *Manager) runProvision(job *Job, picks []Node, templateID int) {')
          if start < 0: raise SystemExit('provision.go: old runProvision signature not found')
          marker = '\twg.Wait()\n'
          pos = s.find(marker, start)
          if pos < 0: raise SystemExit('provision.go: wg.Wait not found')
          tail = s[pos + len(marker):]
          # Remove the old function's closing body by locating its matching final brace.
          brace = s.find('{', start); depth = 0; end = None; in_str = None; esc = False
          for i in range(brace, len(s)):
              c = s[i]
              if in_str:
                  if esc: esc = False
                  elif c == '\\': esc = True
                  elif c == in_str: in_str = None
              elif c in ('"', '`', "'"): in_str = c
              elif c == '{': depth += 1
              elif c == '}':
                  depth -= 1
                  if depth == 0: end = i + 1; break
          if end is None: raise SystemExit('provision.go: unmatched runProvision braces')
          newfun = '''func (m *Manager) runProvision(job *Job, picks []Node) {\n\tdefer job.Finish()\n\tvar wg sync.WaitGroup\n\tfor i, node := range picks {\n\t\tt, err := m.Start(node)\n\t\tif err != nil {\n\t\t\tjob.Set(i, "failed", err.Error())\n\t\t\tcontinue\n\t\t}\n\t\tjob.Set(i, "running", "正在连接 "+node.HostName)\n\t\twg.Add(1)\n\t\tgo func(i int, t *Tunnel) {\n\t\t\tdefer wg.Done()\n\t\t\tm.waitUp(t)\n\t\t\tif t.Status == "up" {\n\t\t\t\tjob.Set(i, "ok", t.ExitIP)\n\t\t\t\treturn\n\t\t\t}\n\t\t\tjob.Set(i, "failed", firstLine(t.Err))\n\t\t}(i, t)\n\t}\n\twg.Wait()\n}\n'''
          p.write_text(s[:start] + newfun + s[end:])

          for path in ['native_test.go', 'xui_test.go', 'provision_test.go']:
              p = Path(path)
              if not p.exists(): continue
              text = p.read_text()
              while 'CloneToTunnels' in text:
                  idx = text.index('CloneToTunnels')
                  begin = text.rfind('\nfunc Test', 0, idx)
                  if begin < 0: raise SystemExit(f'{path}: cannot locate clone test')
                  brace = text.find('{', begin, idx); depth = 0; end = None
                  for i in range(brace, len(text)):
                      if text[i] == '{': depth += 1
                      elif text[i] == '}':
                          depth -= 1
                          if depth == 0: end = i + 1; break
                  if end is None: raise SystemExit(f'{path}: unmatched test braces')
                  text = text[:begin] + text[end:]
              p.write_text(text)
          PY

          gofmt -w *.go
          go test ./...
          if grep -RniE 'CloneToTunnels|apiXUIClone|/api/xui/clone' --include='*.go' .; then exit 1; fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/finalize-manual-binding.yml
          git add -A
          git commit -m 'make manual node to exit binding the first version'
          git push origin main
