name: cleanup-clone-v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove clone API and automatic node creation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def remove_func(path, name):
              p = Path(path); s = p.read_text()
              pat = re.compile(r'(?m)^func(?:\s+\([^\n]*\))?\s+' + re.escape(name) + r'\s*\([^\n]*\)\s*(?:\([^\n]*\)|[^\n]*)\s*\{')
              m = pat.search(s)
              if not m: raise SystemExit(f'{path}: {name} not found')
              start=m.start(); brace=s.find('{',m.start(),m.end()); depth=0; i=brace
              in_str=None; esc=False; line=False; block=False
              while i<len(s):
                  c=s[i]; n=s[i+1] if i+1<len(s) else ''
                  if line:
                      if c=='\n': line=False
                  elif block:
                      if c=='*' and n=='/': block=False; i+=1
                  elif in_str:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==in_str: in_str=None
                  else:
                      if c=='/' and n=='/': line=True; i+=1
                      elif c=='/' and n=='*': block=True; i+=1
                      elif c in ('"','`',"'"): in_str=c
                      elif c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0:
                              end=i+1
                              if end<len(s) and s[end]=='\n': end+=1
                              p.write_text(s[:start]+s[end:]); return
                  i+=1
              raise SystemExit(f'{path}: unmatched braces in {name}')

          # Main route and handler.
          p=Path('main.go'); s=p.read_text()
          s=s.replace('\n\tmux.HandleFunc("/api/xui/clone", apiXUIClone(mgr))','')
          s=s.replace('TemplateID: req.TemplateID,','')
          p.write_text(s)
          remove_func('main.go','apiXUIClone')

          # Panel interface and implementations.
          p=Path('panel.go'); lines=p.read_text().splitlines(True)
          lines=[x for x in lines if 'CloneToTunnels(templateID int, hosts []string, tunnels []*Tunnel)' not in x]
          p.write_text(''.join(lines))
          remove_func('native.go','CloneToTunnels')
          remove_func('xui.go','CloneToTunnels')

          # Provision becomes exit-only. No TemplateID and no node cloning.
          p=Path('provision.go'); s=p.read_text()
          s=s.replace('\n\tTemplateID int // 3x-ui 入站模板；0 表示只开隧道不建入站','')
          s=s.replace('\n\tif req.TemplateID > 0 {\n\t\tlabels = append(labels, "创建节点链接")\n\t}','')
          s=s.replace('go m.runProvision(job, picks, req.TemplateID)','go m.runProvision(job, picks)')
          start=s.find('func (m *Manager) runProvision(job *Job, picks []Node, templateID int) {')
          if start<0: raise SystemExit('provision.go: old runProvision not found')
          brace=s.find('{',start); depth=0; end=None; in_str=None; esc=False
          for i in range(brace,len(s)):
              c=s[i]
              if in_str:
                  if esc: esc=False
                  elif c=='\\': esc=True
                  elif c==in_str: in_str=None
              elif c in ('"','`',"'"): in_str=c
              elif c=='{': depth+=1
              elif c=='}':
                  depth-=1
                  if depth==0: end=i+1; break
          if end is None: raise SystemExit('provision.go: unmatched runProvision')
          newfun='''func (m *Manager) runProvision(job *Job, picks []Node) {\n\tdefer job.Finish()\n\tvar wg sync.WaitGroup\n\tfor i, node := range picks {\n\t\tt, err := m.Start(node)\n\t\tif err != nil {\n\t\t\tjob.Set(i, "failed", err.Error())\n\t\t\tcontinue\n\t\t}\n\t\tjob.Set(i, "running", "正在连接 "+node.HostName)\n\t\twg.Add(1)\n\t\tgo func(i int, t *Tunnel) {\n\t\t\tdefer wg.Done()\n\t\t\tm.waitUp(t)\n\t\t\tif t.Status == "up" {\n\t\t\t\tjob.Set(i, "ok", t.ExitIP)\n\t\t\t\treturn\n\t\t\t}\n\t\t\tjob.Set(i, "failed", firstLine(t.Err))\n\t\t}(i, t)\n\t}\n\twg.Wait()\n}\n'''
          p.write_text(s[:start]+newfun+s[end:])

          # Remove tests dedicated to deleted clone behavior.
          for name in ['native_test.go','xui_test.go','provision_test.go']:
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text()
              while 'CloneToTunnels' in s:
                  idx=s.index('CloneToTunnels'); start=s.rfind('\nfunc Test',0,idx)
                  if start<0: raise SystemExit(f'{name}: clone test start not found')
                  brace=s.find('{',start,idx); depth=0; end=None
                  for i in range(brace,len(s)):
                      if s[i]=='{': depth+=1
                      elif s[i]=='}':
                          depth-=1
                          if depth==0: end=i+1; break
                  if end is None: raise SystemExit(f'{name}: unmatched test')
                  s=s[:start]+s[end:]
              p.write_text(s)
          PY

          gofmt -w *.go
          go test ./...
          if grep -RniE 'CloneToTunnels|apiXUIClone|/api/xui/clone' --include='*.go' .; then
            echo 'clone references remain'
            exit 1
          fi
          if grep -RniE 'TemplateID|runProvision\([^\n]*template' --include='*.go' .; then
            echo 'automatic template provisioning references remain'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/cleanup-clone-v2.yml
          git add -A
          git commit -m 'remove automatic node cloning and make exits manual binding only'
          git push origin main
