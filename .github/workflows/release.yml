name: build-and-publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            xray_asset: Xray-linux-64.zip
            cloudflared_asset: cloudflared-linux-amd64
          - goarch: arm64
            xray_asset: Xray-linux-arm64-v8a.zip
            cloudflared_asset: cloudflared-linux-arm64

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: 编译 fanout
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-dev}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o fanout .
      - name: 下载内置依赖
        run: |
          set -euo pipefail
          mkdir -p bundle
          curl -fL --retry 5 --retry-delay 2 "https://github.com/XTLS/Xray-core/releases/latest/download/${{ matrix.xray_asset }}" -o bundle/xray.zip
          unzip -qo bundle/xray.zip -d bundle/xray
          test -f bundle/xray/xray
          install -m 755 bundle/xray/xray bundle/xray.bin
          rm -rf bundle/xray bundle/xray.zip
          curl -fL --retry 5 --retry-delay 2 "https://github.com/cloudflare/cloudflared/releases/latest/download/${{ matrix.cloudflared_asset }}" -o bundle/cloudflared
          chmod 755 bundle/cloudflared
      - name: 打包
        run: |
          set -euo pipefail
          cp bundle/xray.bin xray
          cp bundle/cloudflared cloudflared
          tar czf "fanout-linux-${{ matrix.goarch }}.tar.gz" fanout install.sh f.sh fanout.service README.md xray cloudflared
          sha256sum "fanout-linux-${{ matrix.goarch }}.tar.gz" > "fanout-linux-${{ matrix.goarch }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: fanout-linux-${{ matrix.goarch }}
          path: |
            fanout-linux-${{ matrix.goarch }}.tar.gz
            fanout-linux-${{ matrix.goarch }}.sha256

  publish-dist:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: 生成校验和
        run: sha256sum fanout-linux-*.tar.gz > checksums.txt
      - name: 发布 raw 安装源到 dist 分支
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 先把构建产物移到仓库之外，避免切换 dist 时与未跟踪文件冲突。
          rm -rf /tmp/fanout-dist
          mkdir -p /tmp/fanout-dist
          cp fanout-linux-*.tar.gz /tmp/fanout-dist/
          cp checksums.txt /tmp/fanout-dist/

          # 先清理当前 main 工作树，再切换到 dist。
          git reset --hard
          git clean -fdx
          if git ls-remote --exit-code --heads origin dist >/dev/null 2>&1; then
            git fetch origin dist
            git checkout -B dist origin/dist
          else
            git checkout --orphan dist
          fi

          # dist 只保留 raw 安装产物。
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/fanout-dist/* .
          printf '%s\n' "fanout raw installation artifacts" > README.md
          git add -A
          git diff --cached --quiet || git commit -m "publish ${GITHUB_REF_NAME} artifacts"
          git push origin dist

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: 生成校验和
        run: sha256sum fanout-linux-*.tar.gz > checksums.txt
      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fanout-linux-*.tar.gz
            checksums.txt
          generate_release_notes: true
